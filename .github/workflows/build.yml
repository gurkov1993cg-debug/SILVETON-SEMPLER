name: SILVETON SAMPLER Source Extract

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'SILVETON-SEMPLER-source-fixed.zip'

permissions:
  contents: write

concurrency:
  group: silveton-sampler-source-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: SILVETON-SEMPLER-source-fixed.zip

jobs:
  extract-current-source:
    name: Extract current source tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract fixed source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          rm -rf source_current
          mkdir source_current
          unzip -q "$SOURCE_ZIP" -d source_current
          test -f source_current/core/CMakeLists.txt
          test -f source_current/android/app/build.gradle.kts
          test -f source_current/android/app/src/main/cpp/SamplerAudioBridge.cpp
          echo "Current source extracted successfully"

      - name: Commit extracted source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source_current
          if git diff --cached --quiet; then
            echo "source_current already matches archive"
            exit 0
          fi
          git commit -m "Extract current SILVETON sampler source"
          git push origin HEAD:main
