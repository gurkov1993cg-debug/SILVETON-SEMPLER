name: SILVETON Sampler APK

# The tablet program: a NativeActivity made only of C++ (no Kotlin, no Java). Samsung Galaxy Tab A11 (SM-X130), root.
# The source is the folder silveton_pro_payload: inside SILVETON-SEMPLER.zip in the root of the repository (one zip, uploaded
# from the phone), or unpacked as the folder itself.
on:
  push:
    branches:
      - main
    paths:
      - "SILVETON-SEMPLER.zip"
      - "silveton_pro_payload/**"
      - ".github/workflows/silveton-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      GRADLE_VERSION: "8.9"
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_CMAKE_VERSION: "3.22.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare project from ZIP
        shell: bash
        run: |
          set -euo pipefail

          # The program is the folder silveton_pro_payload (android/, core/, host/, ui/, app/android/, resources/, CMakeLists.txt).
          # It comes either as the folder itself in the repository or inside SILVETON-SEMPLER.zip in the root of the repository.
          PROJECT_DIR=""
          if [ -f "silveton_pro_payload/CMakeLists.txt" ] && [ -f "silveton_pro_payload/android/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/silveton_pro_payload"
            echo "Using the folder silveton_pro_payload of the repository"
          else
            ZIP_PATH="SILVETON-SEMPLER.zip"
            if [ ! -f "$ZIP_PATH" ]; then
              echo "ERROR: Missing SILVETON-SEMPLER.zip (put it in the root of the repository)"
              exit 1
            fi
            WORK_DIR="$RUNNER_TEMP/silveton-src"
            rm -rf "$WORK_DIR"
            mkdir -p "$WORK_DIR"
            ditto -x -k "$ZIP_PATH" "$WORK_DIR"
            # the project folder is the one that holds CMakeLists.txt next to android/settings.gradle.kts
            SETTINGS="$(find "$WORK_DIR" -type f -path '*/android/settings.gradle.kts' -print -quit)"
            if [ -n "${SETTINGS:-}" ]; then
              CANDIDATE="$(dirname "$(dirname "$SETTINGS")")"
              if [ -f "$CANDIDATE/CMakeLists.txt" ] && [ -d "$CANDIDATE/core" ]; then PROJECT_DIR="$CANDIDATE"; fi
            fi
            if [ -z "${PROJECT_DIR:-}" ]; then
              echo "ERROR: SILVETON-SEMPLER.zip does not hold the C++ program (CMakeLists.txt + android/settings.gradle.kts + core/)"
              find "$WORK_DIR" -maxdepth 3 -print
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check the tablet project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f app/android/AndroidApp.cpp
          test -f app/android/AndroidRoot.cpp
          test -f resources/fonts/Roboto-Regular.ttf
          test -f host/src/android/SamplerHostAndroid.cpp
          # the whole point: no Kotlin and no Java anywhere in the tablet project
          if find . -type f \( -name '*.kt' -o -name '*.java' -o -name '*.kts' -a ! -name 'build.gradle.kts' -a ! -name 'settings.gradle.kts' \) | grep -q .; then
            echo "ERROR: Kotlin / Java source found - the tablet program must be C++ only" >&2
            find . -type f \( -name '*.kt' -o -name '*.java' \) -print
            exit 1
          fi
          grep -F 'android:hasCode="false"' android/app/src/main/AndroidManifest.xml
          grep -F 'android.app.NativeActivity' android/app/src/main/AndroidManifest.xml
          grep -F 'com.silveton.sampler' android/app/build.gradle.kts
          # the root scripts of the tablet must still be the ones the engine was tuned with
          grep -F 'magiskpolicy' app/android/RootScripts.inc
          grep -F 'promote SilvAudioRT 80 85' app/android/RootScripts.inc
          grep -F 'promote SilvMidiRT 40 75' app/android/RootScripts.inc
          grep -F '0x0000-0xffff' app/android/RootScripts.inc
          grep -F 'configureRealtimeThread("SilvAudioRT", 7, 7, 80);' host/src/android/SamplerHostAndroid.cpp
          grep -F 'configureRealtimeThread("SilvMidiRT", 0, 5, 70);' host/src/android/SamplerHostAndroid.cpp
          grep -F 'constexpr unsigned kRate = 96000U;' host/src/android/SamplerHostAndroid.cpp
          grep -F 'kControlDevice = "/dev/snd/controlC0"' host/src/android/SamplerHostAndroid.cpp

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm +111 2>/dev/null | tail -1 || true)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" \
            "platforms;android-35" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

          NDK_HOME="$ANDROID_SDK/ndk/$ANDROID_NDK_VERSION"
          test -f "$NDK_HOME/sources/android/native_app_glue/android_native_app_glue.c"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/silveton-tools"
          mkdir -p "$TOOLS"
          if [ ! -x "$TOOLS/gradle-$GRADLE_VERSION/bin/gradle" ]; then
            curl -fL --retry 3 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" -o "$TOOLS/gradle.zip"
            unzip -q -o "$TOOLS/gradle.zip" -d "$TOOLS"
          fi
          GRADLE_BIN="$TOOLS/gradle-$GRADLE_VERSION/bin/gradle"
          test -x "$GRADLE_BIN"
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"

      - name: Build tablet APK
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/silveton-android-artifact"
          LOG="$RUNNER_TEMP/silveton-android-artifact/gradle-build.log"
          cd "$PROJECT_DIR/android"
          set +e
          CI=true "$GRADLE_BIN" --no-daemon --console=plain clean assembleRelease 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "===== EXACT COMPILER / LINKER ERRORS ====="
            grep -E '(error:|fatal error:|undefined reference|undefined symbol|FAILED|What went wrong|CMake Error|ld: )' "$LOG" | tail -n 200 || true
            echo "===== END ERRORS ====="
            # the native build keeps its own logs: show their end
            find "$PROJECT_DIR/android/app/.cxx" -name 'build_output.txt' -print 2>/dev/null | while read -r f; do
              echo "----- $f (end) -----"
              tail -n 120 "$f" || true
            done
          fi
          exit "$STATUS"

      - name: Verify and package the APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -f "$APK"

          AAPT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/zipalign"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          BADGING="$("$AAPT" dump badging "$APK")"
          case "$BADGING" in
            *"package: name='com.silveton.sampler'"*) ;;
            *) echo "Wrong package id" >&2; exit 1 ;;
          esac
          case "$BADGING" in
            *"targetSdkVersion:'35'"*) ;;
            *) echo "Wrong targetSdk" >&2; exit 1 ;;
          esac
          case "$BADGING" in
            *"native-code: 'arm64-v8a'"*) ;;
            *) echo "The program must be arm64-v8a" >&2; exit 1 ;;
          esac
          case "$BADGING" in
            *"launchable-activity: name='android.app.NativeActivity'"*) ;;
            *) echo "The launcher activity must be the NativeActivity" >&2; exit 1 ;;
          esac

          LIST="$(unzip -l "$APK")"
          case "$LIST" in *"lib/arm64-v8a/libsilveton_sampler.so"*) ;; *) echo "libsilveton_sampler.so is missing" >&2; exit 1 ;; esac
          case "$LIST" in *"assets/fonts/Roboto-Regular.ttf"*) ;; *) echo "Fonts are missing inside the APK" >&2; exit 1 ;; esac
          case "$LIST" in *"classes.dex"*) echo "NOTE: the APK holds a classes.dex (expected none)";; esac

          # NativeActivity finds the program by the name ANativeActivity_onCreate: it must be in the library
          WORK="$RUNNER_TEMP/apk-check"
          rm -rf "$WORK"; mkdir -p "$WORK"
          unzip -q -o "$APK" 'lib/arm64-v8a/libsilveton_sampler.so' -d "$WORK"
          LLVM_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          "$LLVM_BIN/llvm-nm" -D --defined-only "$WORK/lib/arm64-v8a/libsilveton_sampler.so" | tee "$WORK/symbols.txt" | grep -E ' T (ANativeActivity_onCreate|android_main)$' || true
          grep -q ' T ANativeActivity_onCreate$' "$WORK/symbols.txt" || { echo "ANativeActivity_onCreate is not exported" >&2; exit 1; }
          "$LLVM_BIN/llvm-readelf" -lW "$WORK/lib/arm64-v8a/libsilveton_sampler.so" | grep LOAD || true

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          mkdir -p "$RUNNER_TEMP/silveton-android-artifact"
          OUT="$RUNNER_TEMP/silveton-android-artifact/SILVETON-SAMPLER-SM-X130.apk"
          cp -f "$APK" "$OUT"
          shasum -a 256 "$OUT" > "$OUT.sha256.txt"
          echo "$BADGING" | head -n 20 > "$RUNNER_TEMP/silveton-android-artifact/APK-INFO.txt"

      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SILVETON-SAMPLER-APK-and-logs
          path: |
            ${{ runner.temp }}/silveton-android-artifact/*.apk
            ${{ runner.temp }}/silveton-android-artifact/*.txt
            ${{ runner.temp }}/silveton-android-artifact/gradle-build.log
          if-no-files-found: warn
          retention-days: 14
