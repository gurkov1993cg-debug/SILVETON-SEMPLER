name: SILVETON Sampler APK
# FAST APK build. Full source/DSP/UI tests are NOT part of the normal Android build.
# IMPORTANT: when SILVETON-SEMPLER.zip is in the repository, it ALWAYS wins over
# any old silveton_pro_payload folder so the new uploaded ZIP is actually built.
on:
  push:
    branches: [main]
    paths:
      - 'SILVETON-SEMPLER.zip'
      - 'silveton_pro_payload/**'
      - '.github/workflows/silveton-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # publish installable APK to Releases

concurrency:
  group: silveton-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select current source (ZIP first)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/SILVETON-SEMPLER.zip" ]; then
            SRC="$GITHUB_WORKSPACE/_silveton_ci_source"
            mkdir -p "$SRC"
            unzip -q "$GITHUB_WORKSPACE/SILVETON-SEMPLER.zip" -d "$SRC"
            PROJECT_DIR="$SRC/silveton_pro_payload"
            echo 'Building the latest SILVETON-SEMPLER.zip (not the old repo folder)'
          else
            PROJECT_DIR="$GITHUB_WORKSPACE/silveton_pro_payload"
            echo 'No ZIP; building the source directory'
          fi
          test -f "$PROJECT_DIR/CMakeLists.txt"
          test -f "$PROJECT_DIR/android/settings.gradle.kts"
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.9: downloaded/cached by the action instead of a new curl/unzip on every run.
      - name: Gradle 8.9 with dependency caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK/NDK (install only missing components)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          test -x "$SDKMANAGER"
          MISSING=()
          test -d "$SDK/platforms/android-35" || MISSING+=("platforms;android-35")
          test -x "$SDK/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt" || MISSING+=("build-tools;$ANDROID_BUILD_TOOLS_VERSION")
          test -f "$SDK/ndk/$ANDROID_NDK_VERSION/sources/android/native_app_glue/android_native_app_glue.c" || MISSING+=("ndk;$ANDROID_NDK_VERSION")
          test -f "$SDK/cmake/$ANDROID_CMAKE_VERSION/bin/cmake" || MISSING+=("cmake;$ANDROID_CMAKE_VERSION")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "Installing missing Android SDK components: ${MISSING[*]}"
            # Accept licenses only if components must be installed.
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK" "${MISSING[@]}"
          else
            echo 'All required Android SDK components already installed'
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build APK (no separate test suite, no redundant clean)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/silveton-android-artifact"
          cd "$PROJECT_DIR/android"
          CI=true gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/silveton-android-artifact/gradle-build.log"

      # The only post-build safety checks: the APK actually exists, has the correct
      # app/architecture/native library, is 16K-page compatible, and is signed.
      - name: Verify installation package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/android/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          BADGING="$("$BT/aapt" dump badging "$APK")"
          [[ "$BADGING" == *"package: name='com.silveton.sampler'"* ]] || { echo 'Wrong package ID'; exit 1; }
          [[ "$BADGING" == *"native-code: 'arm64-v8a'"* ]] || { echo 'Wrong CPU architecture'; exit 1; }
          unzip -Z1 "$APK" | awk '$0=="lib/arm64-v8a/libsilveton_sampler.so" {found=1} END {exit !found}' || { echo 'Missing native engine'; exit 1; }
          "$BT/zipalign" -c -P 16 4 "$APK"
          "$BT/apksigner" verify "$APK"
          OUT="$RUNNER_TEMP/silveton-android-artifact/SILVETON-SAMPLER-SM-X130.apk"
          cp "$APK" "$OUT"
          shasum -a 256 "$OUT" > "$OUT.sha256.txt"

      - name: Publish APK for direct download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/silveton-android-artifact/SILVETON-SAMPLER-SM-X130.apk"
          TAG="apk-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$OUT" --target "$GITHUB_SHA" \
            --title "SILVETON Sampler SM-X130 - build ${GITHUB_RUN_NUMBER}" \
            --notes "APK from ${GITHUB_SHA}; workflow run ${GITHUB_RUN_ID}." --latest
          {
            echo '## SILVETON Sampler APK'
            echo "[**Изтегли готовия APK**](https://github.com/${GH_REPO}/releases/latest/download/SILVETON-SAMPLER-SM-X130.apk)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SILVETON-BUILD-FAILURE-LOGS
          path: ${{ runner.temp }}/silveton-android-artifact/gradle-build.log
          if-no-files-found: warn
          retention-days: 7
