workflows:
  silveton-sampler-android:
    name: SILVETON Sampler Android
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      vars:
        SILVETON_ZIP: SILVETON-SEMPLER-source.zip
        GRADLE_VERSION: "8.9"
        ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
        ANDROID_NDK_VERSION: "27.2.12479018"
        ANDROID_CMAKE_VERSION: "3.22.1"

    scripts:
      - name: Prepare source
        script: |
          set -euo pipefail

          test -f "$CM_BUILD_DIR/$SILVETON_ZIP"
          rm -rf "$CM_BUILD_DIR/_silveton_src"
          mkdir -p "$CM_BUILD_DIR/_silveton_src"
          unzip -q "$CM_BUILD_DIR/$SILVETON_ZIP" -d "$CM_BUILD_DIR/_silveton_src"

          SETTINGS="$(find "$CM_BUILD_DIR/_silveton_src" -type f -path '*/android/settings.gradle.kts' -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$(dirname "$SETTINGS")")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Source root: $PROJECT_DIR"
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"
          test -f "$PROJECT_DIR/android/app/src/main/cpp/CMakeLists.txt"
          test -f "$PROJECT_DIR/core/CMakeLists.txt"

      - name: Install Android toolchain
        script: |
          set -euo pipefail

          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          test -d "$ANDROID_SDK"

          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm +111 2>/dev/null | tail -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Modern Android sdkmanager was not found under $ANDROID_SDK/cmdline-tools" >&2
            find "$ANDROID_SDK" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" \
            "platforms;android-35" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

          NDK_HOME="$ANDROID_SDK/ndk/$ANDROID_NDK_VERSION"
          test -d "$NDK_HOME"

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$CM_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$CM_ENV"

      - name: Install Gradle 8.9
        script: |
          set -euo pipefail

          TOOLS="$CM_BUILD_DIR/.silveton-tools"
          mkdir -p "$TOOLS"
          if [ ! -x "$TOOLS/gradle-$GRADLE_VERSION/bin/gradle" ]; then
            curl -fL --retry 3 \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
              -o "$TOOLS/gradle.zip"
            unzip -q -o "$TOOLS/gradle.zip" -d "$TOOLS"
          fi

          GRADLE_BIN="$TOOLS/gradle-$GRADLE_VERSION/bin/gradle"
          test -x "$GRADLE_BIN"
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"
          "$GRADLE_BIN" --version

      - name: Audit Direct ALSA MIDI and GUI contracts
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 ci/audit_direct_alsa.py
          python3 ci/audit_direct_midi.py
          python3 ci/audit_gui_contract.py

      - name: Build and test native core
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          rm -rf build-core
          cmake -S core -B build-core \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17
          cmake --build build-core --parallel "$(sysctl -n hw.ncpu)"
          ctest --test-dir build-core --output-on-failure

      - name: Build release APK
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          CI=true "$GRADLE_BIN" --no-daemon --stacktrace clean assembleRelease

      - name: Verify and collect APK
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          AAPT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/zipalign"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-readelf"
          if [ ! -x "$READELF" ]; then
            READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-arm64/bin/llvm-readelf"
          fi
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$READELF"

          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.silveton.sampler'"
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"

          ABIS="$(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\/[^/]+\.so$/ {print $2}' | sort -u)"
          test "$ABIS" = "arm64-v8a"
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libsilveton_jni.so'
          TMP_DIR="$(mktemp -d)"
          unzip -qq "$APK" 'lib/arm64-v8a/libsilveton_jni.so' -d "$TMP_DIR"
          "$READELF" -h "$TMP_DIR/lib/arm64-v8a/libsilveton_jni.so" | grep -Eq 'Machine:[[:space:]]+AArch64'
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          rm -rf "$TMP_DIR"

          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$APK" "$CM_BUILD_DIR/artifacts/SILVETON-SAMPLER-release.apk"
          shasum -a 256 "$CM_BUILD_DIR/artifacts/SILVETON-SAMPLER-release.apk" \
            > "$CM_BUILD_DIR/artifacts/SILVETON-SAMPLER-release.apk.sha256.txt"

          echo "APK ready:"
          ls -lh "$CM_BUILD_DIR/artifacts/SILVETON-SAMPLER-release.apk"
          cat "$CM_BUILD_DIR/artifacts/SILVETON-SAMPLER-release.apk.sha256.txt"

    artifacts:
      - artifacts/SILVETON-SAMPLER-release.apk
      - artifacts/SILVETON-SAMPLER-release.apk.sha256.txt
