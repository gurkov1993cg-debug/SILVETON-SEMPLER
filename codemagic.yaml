workflows:
  silveton-sampler-system:
    name: SILVETON Sampler System App
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      vars:
        SILVETON_ZIP: SILVETON-SEMPLER-source-fixed.zip
        GRADLE_VERSION: "8.9"
        ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
        ANDROID_NDK_VERSION: "27.2.12479018"
        ANDROID_CMAKE_VERSION: "3.22.1"

    scripts:
      - name: Prepare SILVETON system-app source
        script: |
          set -euo pipefail
          test -f "$CM_BUILD_DIR/$SILVETON_ZIP"
          test -f "$CM_BUILD_DIR/codemagic_runtime_fix.py"
          test -f "$CM_BUILD_DIR/codemagic_system_app_fix.py"
          test -f "$CM_BUILD_DIR/codemagic_gui_sampler3.py"
          test -f "$CM_BUILD_DIR/codemagic_make_system_payload.py"

          rm -rf "$CM_BUILD_DIR/_silveton_src"
          mkdir -p "$CM_BUILD_DIR/_silveton_src"
          unzip -q "$CM_BUILD_DIR/$SILVETON_ZIP" -d "$CM_BUILD_DIR/_silveton_src"

          SETTINGS="$(find "$CM_BUILD_DIR/_silveton_src" -type f -path '*/android/settings.gradle.kts' -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$(dirname "$SETTINGS")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

          python3 "$CM_BUILD_DIR/codemagic_runtime_fix.py" "$PROJECT_DIR"
          python3 "$CM_BUILD_DIR/codemagic_system_app_fix.py" "$PROJECT_DIR"
          python3 "$CM_BUILD_DIR/codemagic_gui_sampler3.py" "$PROJECT_DIR"

          BRIDGE="$PROJECT_DIR/android/app/src/main/cpp/SamplerAudioBridge.cpp"
          RUNTIME="$PROJECT_DIR/android/app/src/main/java/com/silveton/sampler/SamplerRuntime.kt"
          MODE="$PROJECT_DIR/android/app/src/main/java/com/silveton/sampler/SilvetonSystemMode.kt"
          VIEW="$PROJECT_DIR/android/app/src/main/java/com/silveton/sampler/SilvetonSamplerView.kt"
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          grep -F 'constexpr unsigned kRate = 96000U;' "$BRIDGE"
          grep -F 'constexpr unsigned kPeriods = 2U;' "$BRIDGE"
          grep -F 'pinCurrentThreadToCpu(7);' "$BRIDGE"
          grep -F 'pinCurrentThreadToCpu(6);' "$BRIDGE"
          grep -F 'sys.silveton.performance' "$MODE"
          grep -F 'SilvetonSystemMode.enter()' "$RUNTIME"
          grep -F 'SILVETON-sampler-3.zip' "$VIEW"
          grep -F 'DESIGN_W = 1340f' "$VIEW"
          grep -F 'private fun drawBrand' "$VIEW"
          grep -F 'android:directBootAware="true"' "$MANIFEST"
          grep -F 'com.silveton.sampler.permission.DIRECT_ALSA' "$MANIFEST"

          if grep -Fq '#include <aaudio/AAudio.h>' "$BRIDGE"; then
            echo "ERROR: AAudio returned to Direct ALSA runtime" >&2
            exit 1
          fi

      - name: Install Android toolchain
        script: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm +111 2>/dev/null | tail -1 || true)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" \
            "platforms;android-35" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

          NDK_HOME="$ANDROID_SDK/ndk/$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$CM_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$CM_ENV"

      - name: Install Gradle 8.9
        script: |
          set -euo pipefail
          TOOLS="$CM_BUILD_DIR/.silveton-tools"
          mkdir -p "$TOOLS"
          if [ ! -x "$TOOLS/gradle-$GRADLE_VERSION/bin/gradle" ]; then
            curl -fL --retry 3 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" -o "$TOOLS/gradle.zip"
            unzip -q -o "$TOOLS/gradle.zip" -d "$TOOLS"
          fi
          GRADLE_BIN="$TOOLS/gradle-$GRADLE_VERSION/bin/gradle"
          test -x "$GRADLE_BIN"
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"

      - name: Audit sampler contracts
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 ci/audit_direct_alsa.py
          python3 ci/audit_direct_midi.py
          python3 ci/audit_gui_contract.py

      - name: Build and test native core
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          rm -rf build-core
          cmake -S core -B build-core \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DSILVETON_LIVE_BUILD_TESTS=ON
          cmake --build build-core --parallel "$(sysctl -n hw.ncpu)"
          ctest --test-dir build-core --output-on-failure

      - name: Build system-app APK
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          CI=true "$GRADLE_BIN" --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK and build one system integration artifact
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -f "$APK"

          AAPT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/zipalign"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          BADGING="$("$AAPT" dump badging "$APK")"
          case "$BADGING" in
            *"package: name='com.silveton.sampler'"*) ;;
            *) echo "Wrong package id" >&2; exit 1 ;;
          esac
          case "$BADGING" in
            *"targetSdkVersion:'35'"*) ;;
            *) echo "Wrong targetSdk" >&2; exit 1 ;;
          esac

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          mkdir -p "$CM_BUILD_DIR/artifacts"
          python3 "$CM_BUILD_DIR/codemagic_make_system_payload.py" "$APK" "$CM_BUILD_DIR/artifacts"

          PACKAGE="$CM_BUILD_DIR/artifacts/SILVETON-SM-X130-SYSTEM-INTEGRATION.zip"
          test -f "$PACKAGE"
          unzip -p "$PACKAGE" system_ext/priv-app/SilvetonSampler/SilvetonSampler.apk >/dev/null
          unzip -p "$PACKAGE" system_ext/etc/permissions/silveton-direct-alsa.xml | grep -F '<group gid="audio" />'
          unzip -p "$PACKAGE" system_ext/etc/init/silveton-performance.rc | grep -F 'sys.silveton.performance=1'
          unzip -p "$PACKAGE" sepolicy/private/silveton_app.te | grep -F 'audio_device:chr_file'
          unzip -p "$PACKAGE" sepolicy/private/seapp_contexts | grep -F 'name=com.silveton.sampler'
          unzip -p "$PACKAGE" sepolicy/private/property_contexts | grep -F 'sys.silveton.performance'
          if unzip -l "$PACKAGE" | grep -qi magisk; then
            echo "ERROR: Magisk content present" >&2
            exit 1
          fi
          shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256.txt"

    artifacts:
      - artifacts/SILVETON-SM-X130-SYSTEM-INTEGRATION.zip
      - artifacts/SILVETON-SM-X130-SYSTEM-INTEGRATION.zip.sha256.txt
